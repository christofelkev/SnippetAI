[package]
name = "snippet-app"
version = "0.1.0"
edition = "2021"

[dependencies]
snippet-core = { path = "../snippet-core" }
slint = "1.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
arboard = "3.4"
syntect = "5"
tray-icon = "0.19"
global-hotkey = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[build-dependencies]
slint-build = "1.9"
